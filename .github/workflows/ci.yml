# 兼容性门禁：改动进 main 前必须通过 compat（Chrome ≥ 51 / iOS ≥ 13）
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compat:
    name: compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（postcss / doiuse）
        run: npm ci

      - name: 兼容门禁（Chrome ≥ 51 / iOS ≥ 13）
        run: npm run compat
